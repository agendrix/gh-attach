name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # create the GitHub Release + upload assets
  id-token: write       # OIDC token for cosign keyless signing
  attestations: write   # GitHub build provenance attestations

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Pin to a release tag rather than a moving major so a compromised
      # upstream tag can't silently change signing behaviour. v4.x
      # installs cosign v3, whose Sigstore-bundle format goreleaser-action
      # requires to verify its own pinned download.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run goreleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub-native build provenance: a signed attestation binding the
      # released binaries to this workflow/commit. Independent of cosign;
      # auditors verify with `gh attestation verify <binary> --repo agendrix/gh-attach`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*/gh-attach'
